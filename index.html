<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>備忘錄工具</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 SortableJS (用於拖曳排序) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

<body class="bg-gradient-to-br from-slate-50 to-blue-50 text-slate-800 font-sans min-h-screen relative flex flex-col">

    <!-- 全域客製化確認彈窗 -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[70] hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-xs overflow-hidden transform transition-all scale-95 text-center p-6" id="confirm-modal-card">
            <div class="w-12 h-12 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-4 shadow-sm">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2" id="confirm-modal-title">確定要執行嗎？</h3>
            <p class="text-sm text-slate-500 mb-6" id="confirm-modal-desc">此動作無法復原。</p>
            <div class="flex gap-3">
                <button type="button" id="confirm-modal-cancel" class="flex-1 py-2.5 rounded-xl font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition-all text-sm focus:outline-none">
                    取消

                <button type="button" id="confirm-modal-ok" class="flex-1 py-2.5 rounded-xl font-medium text-white bg-red-600 hover:bg-red-700 transition-all text-sm focus:outline-none shadow-sm">
                    確定
                </button>
            </div>
        </div>

    <!-- 圖片放大燈箱 (Lightbox) -->
    <div id="lightbox-modal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300 cursor-zoom-out">
        <button type="button" onclick="window.closeLightbox()" class="absolute top-4 right-4 md:top-6 md:right-6 bg-white/10 hover:bg-white/20 text-white rounded-full p-2 transition-colors focus:outline-none z-50">
            <i data-lucide="x" class="w-6 h-6 md:w-8 md:h-8"></i>
        </button>
        <img id="lightbox-img" src="" alt="放大圖片" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl transform transition-transform scale-95 duration-300" />
    </div>

    <!-- 主要內容區 -->

            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-50 text-blue-600 mb-4 shadow-sm">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900" id="auth-title">開啟專屬備忘錄</h2>
                <p class="text-sm text-slate-500 mt-2 empty:hidden" id="auth-subtitle"></p>
            </div>

            <div class="flex p-1 bg-slate-100 rounded-xl mb-6" id="auth-tabs-container">
                <button id="tab-login" class="flex-1 py-2 text-sm font-medium rounded-lg bg-white shadow-sm text-slate-900 transition-all">登入現有空間</button>
                <button id="tab-create" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-700 transition-all">建立新空間</button>
            </div>

            <form id="auth-form" class="flex flex-col gap-4">
                <div id="auth-fields-container" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1 flex justify-between items-center">
                            <span id="account-id-label">您的帳號代碼</span>
                            <span id="auto-gen-badge" class="hidden text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold tracking-wider">自訂帳號</span>
                        </label>
                        <input type="text" id="auth-account-id" placeholder="請輸入您的帳號代碼"
                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all font-mono font-bold text-slate-700"
                            required minlength="4">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">空間密碼</label>
                        <div class="relative">
                            <input type="password" id="auth-password" placeholder="請輸入密碼 (最少4碼)"
                                class="w-full p-3 pr-10 bg-slate-50 border border-slate-200 rounded-xl focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all tracking-widest"
                                required minlength="4">
                            <button type="button" id="toggle-password-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <p id="auth-error" class="text-red-500 text-sm hidden text-center bg-red-50 py-2 rounded-lg transition-all"></p>
                <button type="submit" id="auth-submit-btn"
                    class="w-full flex items-center justify-center gap-2 bg-slate-900 text-white px-6 py-3 rounded-xl font-medium hover:bg-slate-800 transition-all active:scale-95 mt-2 disabled:opacity-70">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    <span id="auth-submit-text">登入空間</span>
                </button>
            </form>
        </div>

                        <div class="bg-blue-600 p-2 rounded-xl shadow-sm">
                            <i data-lucide="list-todo" class="w-6 h-6 md:w-7 md:h-7 text-white"></i>
                        </div>
                        我的備忘錄
                    </h1>
                    <p class="text-sm md:text-base text-slate-500 mt-2">簡單記錄，自由排序。</p>
                </div>
                <div id="user-profile" class="flex flex-wrap items-center justify-center gap-2 text-xs text-slate-500 bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm w-fit mx-auto sm:mx-0">
                    <div class="flex items-center gap-1.5 px-2 py-1 bg-blue-50 text-blue-700 rounded-lg">
                        <i data-lucide="user" class="w-3.5 h-3.5"></i>
                        <span class="font-medium">代碼: <span id="room-code-display" class="font-mono font-bold select-all">----</span></span>
                    </div>
                    <div class="w-px h-4 bg-slate-200 mx-1"></div>
                    <button id="logout-btn" class="text-slate-400 hover:text-red-500 hover:bg-red-50 px-2 py-1 rounded transition-colors flex items-center gap-1 font-medium group">
                        <i data-lucide="log-out" class="w-3 h-3"></i>登出
                    </button>
                </div>
            </header>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 md:p-6 mb-6 md:mb-8 transition-shadow focus-within:shadow-md focus-within:border-blue-200">
                <form id="memo-form" class="flex flex-col gap-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">歸屬分類</label>
                        <div class="flex overflow-x-auto gap-2 no-scrollbar w-full pb-1" id="category-selector"></div>
                    </div>
                    <div class="relative w-full">
                        <input type="text" id="memo-input" placeholder="記下要做的事..."

                        <button type="button" id="clear-input-btn" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 focus:outline-none hidden">

                        </button>
                    </div>
                    <div class="flex flex-col gap-3 bg-slate-50/50 p-3 rounded-xl border border-slate-100">
                        <div class="flex items-center justify-between">
                            <button type="button" id="trigger-image-btn" class="flex items-center gap-2 text-sm font-medium text-slate-600 bg-white border border-slate-200 shadow-sm px-4 py-2 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-all">

                            </button>
                            <input type="file" id="memo-image-input" accept="image/*" multiple max="5" class="hidden" />
                        </div>
                        <div id="image-preview-list" class="hidden flex flex-wrap gap-3 mt-1"></div>
                    </div>
                    <div class="flex items-center justify-end gap-3 w-full mt-1">
                        <button type="button" id="cancel-edit-btn" class="hidden px-5 py-2.5 rounded-xl font-medium text-slate-500 hover:bg-slate-100 transition-all text-sm">取消編輯</button>
                        <button type="submit" id="submit-btn" disabled class="flex items-center justify-center gap-2 bg-slate-900 text-white px-8 py-2.5 rounded-xl font-medium hover:bg-slate-800 disabled:opacity-50 transition-all active:scale-95 shadow-sm">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                            <span>新增</span>
                        </button>
                    </div>
                </form>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden relative">
                <div class="p-3 border-b border-slate-100 bg-white relative z-20">
                    <div class="relative w-full">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="search-input" placeholder="搜尋備忘錄關鍵字..."
                            class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-transparent rounded-xl focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm placeholder:text-slate-400" />
                    </div>
                </div>
                <div class="flex items-center justify-between border-b border-slate-100 pr-2 md:pr-3 sticky top-0 bg-white/90 backdrop-blur-md z-10 shadow-sm">
                    <div class="flex overflow-x-auto no-scrollbar p-2 md:p-3 gap-2" id="filter-tabs"></div>
                    <button id="clear-completed-btn" class="hidden text-xs font-medium text-slate-400 hover:text-red-600 flex items-center gap-1 px-3 py-2 rounded-xl hover:bg-red-50">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>清除已完成
                    </button>
                </div>
                <div class="p-2 md:p-4 min-h-[200px] bg-slate-50/50" id="memo-list-container"></div>
            </div>
        </div>
    </div>

    <footer class="w-full text-center pb-8 mt-4 pointer-events-none flex flex-col items-center gap-3">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/60 text-slate-500 text-[11px] font-medium border border-slate-200/60 backdrop-blur-sm shadow-sm">
            <i data-lucide="users" class="w-3.5 h-3.5"></i>
            累積使用人次：<span id="visitor-count" class="font-mono font-bold text-slate-700 tracking-wider">--</span>
        </div>
        <a href="https://www.twainews.com.tw/" target="_blank" class="inline-flex items-center gap-2 text-xs font-bold text-slate-600 hover:text-blue-600 transition-colors bg-white/70 hover:bg-white px-5 py-2.5 rounded-full shadow-sm border border-slate-200/60 backdrop-blur-sm pointer-events-auto">
            <img src="https://firebasestorage.googleapis.com/v0/b/memorandum-3abaa.firebasestorage.app/o/gemini-generated-image-w8bmabw8bmabw8bm-1-removebg-preview-2-1_orig.png?alt=media&token=2d3df30f-4cc7-4f28-b15c-0e3de6bdd9e1" alt="TWAI Logo" class="w-5 h-5 rounded-md object-contain" onerror="this.style.display='none'; document.getElementById('twai-fallback-icon').classList.remove('hidden');" />
            <i id="twai-fallback-icon" data-lucide="zap" class="w-4 h-4 hidden"></i>
            TWAI NEWS 製作提供
        </a>
    </footer>

    <!-- 分類管理 Modal -->
    <div id="manage-categories-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-sm overflow-hidden transform transition-all scale-95 flex flex-col max-h-[80vh]">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i data-lucide="settings-2" class="w-5 h-5 text-blue-500"></i>管理所有分類</h3>
                <button type="button" onclick="window.closeManageCategoriesModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-grow no-scrollbar" id="manage-categories-list"></div>
            <div class="p-4 border-t border-slate-100">
                <button type="button" onclick="window.openCategoryModal()" class="w-full py-2.5 rounded-xl font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 flex items-center justify-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>新增分類</button>
            </div>
        </div>
    </div>

    <!-- 編輯分類 Modal -->
    <div id="category-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-sm overflow-hidden transform transition-all scale-95 flex flex-col max-h-[80vh]" id="category-modal-card">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i data-lucide="tag" class="w-5 h-5 text-blue-500"></i><span id="cat-modal-title-text">自訂新分類</span></h3>
                <button type="button" onclick="window.closeCategoryModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="cat-modal-form" class="p-6 flex flex-col gap-5 overflow-y-auto no-scrollbar">
                <div><label class="block text-sm font-medium text-slate-700 mb-1.5">分類名稱</label><input type="text" id="cat-modal-input" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-blue-500 outline-none" required maxlength="10"></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-2">選擇顏色</label><div id="cat-color-selector" class="flex flex-wrap gap-3"></div></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-2">選擇圖示</label><div id="cat-icon-selector" class="grid grid-cols-6 gap-2 max-h-48 overflow-y-auto p-1 -mx-1 no-scrollbar border-y border-slate-50"></div></div>
                <div class="flex gap-3 mt-2">
                    <button type="button" id="cat-modal-cancel" class="flex-1 py-2.5 rounded-xl font-medium text-slate-600 bg-slate-100 hover:bg-slate-200">取消</button>
                    <button type="submit" id="cat-modal-submit" disabled class="flex-1 py-2.5 rounded-xl font-medium text-white bg-slate-900 hover:bg-slate-800"><span id="cat-modal-submit-text">確定新增</span></button>
                </div>
            </form>
        </div>
    </div>

        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        window.setModalColor = (idx) => { newCatColorIndex = idx; renderModalSelectors(); };
        window.setModalIcon = (icon) => { newCatIcon = icon; renderModalSelectors(); };
        function renderModalSelectors() { catColorSelector.innerHTML = COLOR_OPTIONS.map((c, i) => `<button type="button" onclick="window.setModalColor(${i})" class="w-8 h-8 rounded-full ${c.display} flex items-center justify-center transition-all ${newCatColorIndex === i ? 'ring-2 ring-offset-2 ring-slate-400' : ''}">${newCatColorIndex === i ? '<i data-lucide="check" class="text-white w-4 h-4"></i>' : ''}</button>`).join(''); catIconSelector.innerHTML = ICON_OPTIONS.map(i => `<button type="button" onclick="window.setModalIcon('${i}')" class="p-2 rounded-xl transition-all ${newCatIcon === i ? 'bg-blue-50 text-blue-600 ring-1 ring-blue-200' : 'text-slate-400'}"><i data-lucide="${i}" class="w-5 h-5"></i></button>`).join(''); lucide.createIcons(); catModalSubmit.disabled = !catModalInput.value.trim(); }
        catModalInput.addEventListener('input', () => catModalSubmit.disabled = !catModalInput.value.trim());
        
        catModalForm.addEventListener('submit', async (e) => { 
            e.preventDefault(); 
            const color = COLOR_OPTIONS[newCatColorIndex]; 
            const data = { label: catModalInput.value.trim(), icon: newCatIcon, color: color.color, bgColor: color.bgColor, borderColor: color.borderColor }; 
            catModalSubmit.disabled = true; 
            try { 
                if (editingCategoryId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId + '_categories', editingCategoryId), data);
                    showToast('已更新分類');
                } else {
                    await setDoc(doc(collection(db, 'artifacts', appId, 'public', 'data', currentRoomId + '_categories')), { ...data, createdAt: Date.now() }); 
                    showToast('已新增分類');
                }
                window.closeCategoryModal(); 
                window.closeManageCategoriesModal(); 
            } catch (e) { console.error(e); showToast('儲存失敗', 'error'); } 
            catModalSubmit.disabled = false; 
        });

        if (clearCompletedBtn) clearCompletedBtn.addEventListener('click', () => { const done = memos.filter(m => m.completed); if (!done.length) return; showConfirm('清除已完成項目', `確定清除這 ${done.length} 筆嗎？`, async () => { for (const m of done) { const imgs = m.images || (m.imagePath ? [{path: m.imagePath}] : []); for (const i of imgs) { if(i.path) await deleteObject(ref(storage, i.path)).catch(e => console.error(e)); } await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId, m.id)); } showToast('已清理', 'info'); }); });
    </script>
</body>
</html>
