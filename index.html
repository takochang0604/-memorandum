<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>備忘錄工具</title>
    <meta name="description" content="支援照片附件的私密備忘錄工具，可附加多張圖片、設定截止日期與優先級，私人空間加密保護。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="備忘錄工具 — 照片＋文字私密記事">
    <meta property="og:description" content="支援照片附件的私密備忘錄工具，可附加多張圖片、設定截止日期與優先級，私人空間加密保護。">
    <meta property="og:locale" content="zh_TW">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="備忘錄工具 — 照片＋文字私密記事">
    <meta name="twitter:description" content="支援照片附件的私密備忘錄工具，可附加多張圖片、設定截止日期與優先級，私人空間加密保護。">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {

            0%,
            100% {
                opacity: .4;
            }

            50% {
                opacity: .8;
            }
        }

        @keyframes pulse-dot {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .priority-high {
            border-left: 3px solid #f43f5e;
        }

        .priority-medium {
            border-left: 3px solid #f59e0b;
        }

        .priority-low {
            border-left: 3px solid #10b981;
        }

        .priority-none {
            border-left: 3px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        input[type=date]::-webkit-calendar-picker-indicator {
            filter: invert(1) opacity(0.5);
            cursor: pointer;
        }

        textarea {
            resize: none;
        }

        .memo-text {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body class="min-h-screen relative flex flex-col text-white"
    style="background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); font-family:'Plus Jakarta Sans',sans-serif;">

    <!-- 全域 Toast 通知容器 -->
    <div id="toast-container"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] flex flex-col gap-3 pointer-events-none"></div>

    <!-- 全域排序選單（fixed，注射到 body，完全脱離任何 overflow 容器） -->
    <div id="sort-dropdown-menu" class="hidden fixed z-[75] rounded-xl overflow-hidden shadow-2xl"
        style="background:rgba(20,18,50,0.97);border:1px solid rgba(255,255,255,0.15);min-width:164px">
        <div class="px-3 py-1.5 text-[10px] font-bold uppercase tracking-widest"
            style="color:rgba(255,255,255,0.3);border-bottom:1px solid rgba(255,255,255,0.07)">排序方式</div>
        <button onclick="window.setSortMode('default')" id="sm-default"
            class="sort-opt w-full text-left px-3 py-2.5 text-xs font-semibold flex items-center gap-2"
            style="color:rgba(255,255,255,0.85)"><i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i>自訂順序</button>
        <button onclick="window.setSortMode('priority')" id="sm-priority"
            class="sort-opt w-full text-left px-3 py-2.5 text-xs font-semibold flex items-center gap-2"
            style="color:rgba(255,255,255,0.55)"><i data-lucide="flame" class="w-3.5 h-3.5"></i>優先級（高→低）</button>
        <button onclick="window.setSortMode('newest')" id="sm-newest"
            class="sort-opt w-full text-left px-3 py-2.5 text-xs font-semibold flex items-center gap-2"
            style="color:rgba(255,255,255,0.55)"><i data-lucide="clock" class="w-3.5 h-3.5"></i>建立時間（新→舊）</button>
        <button onclick="window.setSortMode('oldest')" id="sm-oldest"
            class="sort-opt w-full text-left px-3 py-2.5 text-xs font-semibold flex items-center gap-2"
            style="color:rgba(255,255,255,0.55)"><i data-lucide="history" class="w-3.5 h-3.5"></i>建立時間（舊→新）</button>
        <button onclick="window.setSortMode('due')" id="sm-due"
            class="sort-opt w-full text-left px-3 py-2.5 text-xs font-semibold flex items-center gap-2"
            style="color:rgba(255,255,255,0.55)"><i data-lucide="calendar" class="w-3.5 h-3.5"></i>截止日期（近→遠）</button>
        <button onclick="window.setSortMode('edited')" id="sm-edited"
            class="sort-opt w-full text-left px-3 py-2.5 text-xs font-semibold flex items-center gap-2"
            style="color:rgba(255,255,255,0.55)"><i data-lucide="pencil" class="w-3.5 h-3.5"></i>編輯時間（新→舊）</button>
    </div>

    <!-- 全域客製化確認彈窗 -->
    <div id="confirm-modal"
        class="fixed inset-0 backdrop-blur-md z-[70] hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300"
        style="background:rgba(0,0,0,0.6)">
        <div class="glass rounded-2xl shadow-2xl w-full max-w-xs overflow-hidden transform transition-all scale-95 text-center p-6"
            id="confirm-modal-card">
            <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4"
                style="background:rgba(244,63,94,0.2);color:#f43f5e">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-2" id="confirm-modal-title">確定要執行嗎？</h3>
            <p class="text-sm mb-6" style="color:rgba(255,255,255,0.55)" id="confirm-modal-desc">此動作無法復原。</p>
            <div class="flex gap-3">
                <button type="button" id="confirm-modal-cancel"
                    class="flex-1 py-2.5 rounded-xl font-medium transition-all text-sm focus:outline-none"
                    style="background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7)">
                    取消
                </button>
                <button type="button" id="confirm-modal-ok"
                    class="flex-1 py-2.5 rounded-xl font-bold text-white transition-all text-sm focus:outline-none"
                    style="background:linear-gradient(135deg,#f43f5e,#e11d48)">
                    確定刪除
                </button>
            </div>
        </div>
    </div>

    <!-- 圖片放大燈箱 (Lightbox) -->
    <div id="lightbox-modal"
        class="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300 cursor-zoom-out">
        <button type="button" onclick="window.closeLightbox()"
            class="absolute top-4 right-4 md:top-6 md:right-6 bg-white/10 hover:bg-white/20 text-white rounded-full p-2 transition-colors focus:outline-none z-50">
            <i data-lucide="x" class="w-6 h-6 md:w-8 md:h-8"></i>
        </button>
        <img id="lightbox-img" src="" alt="放大圖片"
            class="max-w-full max-h-full object-contain rounded-xl shadow-2xl transform transition-transform scale-95 duration-300" />
    </div>

    <!-- 主要內容區 -->
    <div class="p-3 sm:p-6 md:p-8 flex justify-center flex-grow items-center">

        <!-- 登入容器 -->
        <div id="auth-container"
            class="w-full max-w-md glass rounded-2xl shadow-2xl p-6 md:p-8 mt-4 transform transition-all">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-5"
                    style="background:linear-gradient(135deg,#a78bfa,#60a5fa);box-shadow:0 8px 24px rgba(167,139,250,0.4)">
                    <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
                </div>
                <h2 class="text-2xl font-extrabold gradient-text" id="auth-title">開啟專屬備忘錄</h2>
                <p class="text-sm mt-2 empty:hidden" style="color:rgba(255,255,255,0.5)" id="auth-subtitle"></p>
            </div>

            <div class="flex p-1 rounded-xl mb-6" id="auth-tabs-container" style="background:rgba(255,255,255,0.08)">
                <button id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all"
                    style="background:rgba(255,255,255,0.15);color:white">登入現有空間</button>
                <button id="tab-create" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all"
                    style="color:rgba(255,255,255,0.5)">建立新空間</button>
            </div>

            <form id="auth-form" class="flex flex-col gap-4">
                <div id="auth-fields-container" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1.5 flex justify-between items-center"
                            style="color:rgba(255,255,255,0.75)">
                            <span id="account-id-label">您的帳號代碼</span>
                            <span id="auto-gen-badge"
                                class="hidden text-[10px] px-2 py-0.5 rounded-full font-bold tracking-wider"
                                style="background:rgba(16,185,129,0.2);color:#34d399">自訂帳號</span>
                        </label>
                        <input type="text" id="auth-account-id" placeholder="請輸入您的帳號代碼"
                            class="w-full p-3 rounded-xl outline-none transition-all font-mono font-bold"
                            style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white;"
                            required minlength="4">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1.5"
                            style="color:rgba(255,255,255,0.75)">空間密碼</label>
                        <div class="relative">
                            <input type="password" id="auth-password" placeholder="請輸入密碼 (最少4碼)"
                                class="w-full p-3 pr-10 rounded-xl outline-none transition-all tracking-widest"
                                style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white;"
                                required minlength="4">
                            <button type="button" id="toggle-password-btn"
                                class="absolute right-3 top-1/2 -translate-y-1/2 focus:outline-none transition-colors"
                                style="color:rgba(255,255,255,0.4)">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <!-- 確認密碼（建立模式才顯示） -->
                    <div id="auth-confirm-pw-wrap" class="hidden">
                        <label class="block text-sm font-semibold mb-1.5"
                            style="color:rgba(255,255,255,0.75)">確認密碼</label>
                        <div class="relative">
                            <input type="password" id="auth-confirm-password" placeholder="再輸入一次密碼"
                                class="w-full p-3 pr-10 rounded-xl outline-none transition-all tracking-widest"
                                style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white;"
                                minlength="4">
                            <button type="button" id="toggle-confirm-pw-btn"
                                class="absolute right-3 top-1/2 -translate-y-1/2 focus:outline-none transition-colors"
                                style="color:rgba(255,255,255,0.4)">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <!-- 記住我 -->
                <label id="remember-me-wrap" class="flex items-center gap-2 cursor-pointer select-none text-sm"
                    style="color:rgba(255,255,255,0.5)">
                    <input type="checkbox" id="remember-me-checkbox"
                        class="w-4 h-4 rounded accent-violet-400 cursor-pointer">
                    記住帳號（下次自動填入）
                </label>
                <p id="auth-error" class="text-sm hidden text-center py-2 rounded-xl transition-all"
                    style="background:rgba(244,63,94,0.15);color:#fca5a5"></p>
                <button type="submit" id="auth-submit-btn"
                    class="w-full flex items-center justify-center gap-2 text-white px-6 py-3 rounded-xl font-bold transition-all active:scale-95 mt-2 disabled:opacity-60"
                    style="background:linear-gradient(135deg,#a78bfa,#60a5fa);box-shadow:0 4px 16px rgba(167,139,250,0.4)">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    <span id="auth-submit-text">登入空間</span>
                </button>
            </form>
        </div>

        <!-- 應用主體 -->
        <div id="app-container" class="w-full max-w-2xl hidden animate-[fadeIn_0.5s_ease-out] self-start pt-4 md:pt-6">
            <header class="mb-6 md:mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-4 md:pt-2">
                <div class="text-center sm:text-left">
                    <h1
                        class="text-2xl md:text-3xl font-extrabold gradient-text flex items-center justify-center sm:justify-start gap-3">
                        <div class="p-2 rounded-xl"
                            style="background:linear-gradient(135deg,#a78bfa,#60a5fa);box-shadow:0 4px 14px rgba(167,139,250,0.5)">
                            <i data-lucide="list-todo" class="w-6 h-6 md:w-7 md:h-7 text-white"></i>
                        </div>
                        我的備忘錄
                    </h1>
                    <p class="text-sm md:text-base mt-2" style="color:rgba(255,255,255,0.45)">記下每一件事，不讓任何待辦從腦中溜走。</p>
                </div>
                <div id="user-profile"
                    class="glass flex flex-wrap items-center justify-center gap-2 text-xs px-3 py-2 rounded-xl w-fit mx-auto sm:mx-0">
                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg"
                        style="background:rgba(167,139,250,0.2);color:#c4b5fd">
                        <i data-lucide="user" class="w-3.5 h-3.5"></i>
                        <span class="font-semibold">帳號: <span id="room-code-display"
                                class="font-mono font-bold select-all">----</span></span>
                    </div>
                    <div class="w-px h-4 mx-1" style="background:rgba(255,255,255,0.15)"></div>
                    <button id="logout-btn"
                        class="px-2 py-1 rounded transition-colors flex items-center gap-1 font-medium"
                        style="color:rgba(255,255,255,0.4)">
                        <i data-lucide="log-out" class="w-3 h-3"></i>登出
                    </button>
                    <div class="w-px h-4 mx-1" style="background:rgba(255,255,255,0.15)"></div>
                    <button id="change-pw-btn"
                        class="px-2 py-1 rounded transition-colors flex items-center gap-1 font-medium"
                        style="color:rgba(255,255,255,0.4)">
                        <i data-lucide="key" class="w-3 h-3"></i>更改密碼
                    </button>
                </div>
            </header>

            <!-- 新增備忘錄區塊（可收展） -->
            <div class="glass rounded-2xl shadow-xl mb-6 md:mb-8 overflow-hidden transition-all">
                <!-- 收展標題列 -->
                <button type="button" id="form-toggle-btn"
                    class="w-full flex items-center justify-between px-4 md:px-6 py-3.5 transition-all"
                    style="border-bottom:1px solid rgba(255,255,255,0.08)">
                    <span class="flex items-center gap-2 text-sm font-bold" style="color:rgba(255,255,255,0.75)">
                        <i data-lucide="plus-circle" class="w-4 h-4" style="color:#a78bfa"></i>
                        新增備忘錄
                        <span id="editing-badge" class="hidden text-[10px] px-2 py-0.5 rounded-full font-bold"
                            style="background:rgba(167,139,250,0.25);color:#c4b5fd">✏️ 編輯中</span>
                    </span>
                    <span class="flex items-center gap-1.5 text-xs" style="color:rgba(255,255,255,0.3)">
                        <span id="form-toggle-hint" class="hidden sm:inline">點擊展開／收起</span>
                        <i data-lucide="chevron-up" id="form-toggle-icon"
                            class="w-4 h-4 transition-transform duration-300"></i>
                    </span>
                </button>
                <!-- 可收展內容 -->
                <div id="form-collapsible" class="transition-all duration-300 overflow-hidden">
                    <div class="p-4 md:p-6">
                        <form id="memo-form" class="flex flex-col gap-4">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <label class="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5"
                                        style="color:rgba(255,255,255,0.5)">
                                        <i data-lucide="folder-open" class="w-3.5 h-3.5" style="color:#a78bfa"></i>
                                        歸屬分類
                                        <span class="normal-case font-normal tracking-normal"
                                            style="color:rgba(255,255,255,0.3)">（點選以切換）</span>
                                    </label>
                                </div>
                                <div class="flex overflow-x-auto gap-2 no-scrollbar w-full pb-1 pt-0.5"
                                    id="category-selector" style="scroll-snap-type:x mandatory">
                                </div>
                                <p class="text-[11px] mt-1.5 flex items-center gap-1"
                                    style="color:rgba(255,255,255,0.25)">
                                    <i data-lucide="info" class="w-3 h-3" style="flex-shrink:0"></i>
                                    選擇分類後才能送出備忘錄
                                </p>
                            </div>
                            <div class="relative w-full">
                                <textarea id="memo-input" placeholder="記下要做的事（支援多行輸入）..." rows="3"
                                    class="w-full text-base p-3 pr-10 rounded-xl outline-none transition-all placeholder:opacity-40"
                                    style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:white;"
                                    autocomplete="off"></textarea>
                                <button type="button" id="clear-input-btn"
                                    class="absolute right-2 top-3 focus:outline-none hidden"
                                    style="color:rgba(255,255,255,0.3)">
                                    <i data-lucide="x-circle" class="w-5 h-5"></i>
                                </button>
                            </div>
                            <!-- 備註欄位 -->
                            <div>
                                <label class="block text-xs font-bold mb-1.5 uppercase tracking-wider"
                                    style="color:rgba(255,255,255,0.4)">備註（選填）</label>
                                <textarea id="memo-note" placeholder="補充說明、細節…" rows="2"
                                    class="w-full text-sm p-3 rounded-xl outline-none transition-all placeholder:opacity-30"
                                    style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);"
                                    autocomplete="off"></textarea>
                            </div>
                            <!-- 開始日期 + 截止日期 + 優先級 -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold mb-1.5 uppercase tracking-wider"
                                        style="color:rgba(255,255,255,0.4)">開始日期（選填）</label>
                                    <input type="date" id="memo-start-date"
                                        class="w-full p-2.5 rounded-xl outline-none text-sm"
                                        style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.8);">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold mb-1.5 uppercase tracking-wider"
                                        style="color:rgba(255,255,255,0.4)">截止日期（選填）</label>
                                    <input type="date" id="memo-due-date"
                                        class="w-full p-2.5 rounded-xl outline-none text-sm"
                                        style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.8);">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold mb-1.5 uppercase tracking-wider"
                                    style="color:rgba(255,255,255,0.4)">優先級</label>
                                <div class="flex gap-2" id="priority-selector">
                                    <button type="button" onclick="window.setPriority('high')" id="pri-high"
                                        class="flex-1 py-2 rounded-xl text-xs font-bold transition-all"
                                        style="background:rgba(244,63,94,0.15);color:#fda4af;border:1px solid rgba(244,63,94,0.2)">⬤
                                        高</button>
                                    <button type="button" onclick="window.setPriority('medium')" id="pri-medium"
                                        class="flex-1 py-2 rounded-xl text-xs font-bold transition-all"
                                        style="background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.1)">⬤
                                        中</button>
                                    <button type="button" onclick="window.setPriority('low')" id="pri-low"
                                        class="flex-1 py-2 rounded-xl text-xs font-bold transition-all"
                                        style="background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.1)">⬤
                                        低</button>
                                </div>
                            </div>
                            <div class="rounded-xl p-3"
                                style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08)">

            const inactiveStyle = 'background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.1)';
            let h = `<button onclick="window.setFilter('all')" class="flex-shrink-0 px-3 py-1.5 text-xs font-bold rounded-xl flex items-center gap-1.5 transition-all" style="${currentFilter === 'all' ? activeStyle : inactiveStyle}"><i data-lucide="layers" class="w-3.5 h-3.5"></i>全分類</button>`;
            h += categories.map(c => `<button onclick="window.setFilter('${c.id}')" class="flex-shrink-0 px-3 py-1.5 text-xs font-bold rounded-xl flex items-center gap-1.5 transition-all" style="${currentFilter === c.id ? activeStyle : inactiveStyle}"><i data-lucide="${c.icon}" class="w-3.5 h-3.5"></i>${c.label}</button>`).join('');
            filterTabs.innerHTML = h; lucide.createIcons();
        }
        function renderMemos() {
            if (!memoListContainer) return;
            if (isLoading) { memoListContainer.innerHTML = '<div class="py-12 text-center" style="color:rgba(255,255,255,0.3)"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-2"></i>讀取中...</div>'; lucide.createIcons(); return; }
            const today = new Date().toISOString().split('T')[0];
            const filtered = memos.filter(m => {
                if (currentFilter !== 'all' && m.category !== currentFilter) return false;
                if (currentPriFilter && m.priority !== currentPriFilter) return false;
                if (currentStatusFilter === 'todo' && m.completed) return false;
                if (currentStatusFilter === 'done' && !m.completed) return false;
                if (currentStatusFilter === 'overdue' && !(m.dueDate && m.dueDate < today && !m.completed)) return false;
                if (currentSearch) {
                    const q = currentSearch;
                    if (!(m.text || '').toLowerCase().includes(q) && !(m.note || '').toLowerCase().includes(q)) return false;
                }
                return true;
            }).sort((a, b) => {
                // 第1優先：已完成排最後
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                // 第2優先：釘選排最前（各排序模式全部適用）
                const aPinned = !!a.pinned && !a.completed;
                const bPinned = !!b.pinned && !b.completed;
                if (aPinned !== bPinned) return aPinned ? -1 : 1;
                // 根據排序模式
                const PRI_ORDER = { high: 0, medium: 1, low: 2 };
                switch (currentSortMode) {
                    case 'priority': {
                        const pa = a.priority in PRI_ORDER ? PRI_ORDER[a.priority] : 3;
                        const pb = b.priority in PRI_ORDER ? PRI_ORDER[b.priority] : 3;
                        if (pa !== pb) return pa - pb;
                        break; // 同優先級→fallback
                    }
                    case 'newest':
                        // 完全不用 order，只看 createdAt（建立時間）
                        return (b.createdAt || 0) - (a.createdAt || 0);
                    case 'oldest':
                        // 完全不用 order，只看 createdAt（建立時間）
                        return (a.createdAt || 0) - (b.createdAt || 0);
                    case 'due': {
                        const da = a.dueDate || '9999-99-99';
                        const db2 = b.dueDate || '9999-99-99';
                        if (da !== db2) return da < db2 ? -1 : 1;
                        break; // 同截止日→fallback
                    }
                    case 'edited':
                        // 編輯時間新→舊，沒有 updatedAt 的以 createdAt 代替
                        return ((b.updatedAt || b.createdAt) || 0) - ((a.updatedAt || a.createdAt) || 0);
                    default: {
                        // 自訂順序：依擺 order 欄位（拖曳後寫入）
                        // order 為 Date.now() * -1 的負數，數値越小代表厂被目前拖曳越前
                        const hasOA = a.order != null;
                        const hasOB = b.order != null;
                        if (hasOA && hasOB) return a.order - b.order;
                        if (hasOA && !hasOB) return -1;
                        if (!hasOA && hasOB) return 1;
                        // 兩者都沒有 order（舊資料）→用建立時間新到舊
                        return (b.createdAt || 0) - (a.createdAt || 0);
                    }
                }
                // 同排序值時，回退到建立時間
                return (b.createdAt || 0) - (a.createdAt || 0);
            });
            clearCompletedBtn.classList.toggle('hidden', !memos.some(m => m.completed));
            if (!filtered.length) { memoListContainer.innerHTML = '<div class="py-12 text-center text-sm" style="color:rgba(255,255,255,0.3)">尚無內容</div>'; return; }
            const PRI_DOT = { high: '#f43f5e', medium: '#f59e0b', low: '#10b981' };
            const PRI_BORDER = { high: 'priority-high', medium: 'priority-medium', low: 'priority-low' };
            const PRI_LABEL = { high: '高', medium: '中', low: '低' };
            memoListContainer.innerHTML = `<ul class="grid grid-cols-1 gap-3 p-2" id="sortable-list">` + filtered.map(m => {
                const c = categories.find(cat => cat.id === m.category) || { label: '未分類', icon: 'help-circle', color: 'text-slate-400', bgColor: '' };
                const imgs = m.images || (m.imageUrl ? [{ url: m.imageUrl, path: m.imagePath }] : []);
                let imgH = '';
                if (imgs.length && !compactView) {
                    if (imgs.length === 1) {
                        imgH = `<div class="mt-2 flex"><div class="rounded-lg overflow-hidden cursor-zoom-in" style="height:140px;width:auto;max-width:240px;border:1px solid rgba(255,255,255,0.1)"><img src="${imgs[0].url}" class="h-full w-auto object-cover" onclick="window.openLightbox('${imgs[0].url}')"></div></div>`;
                    } else {
                        const cols = imgs.length === 2 ? 'grid-cols-2' : 'grid-cols-3';
                        imgH = `<div class="mt-2 grid ${cols} gap-1.5" style="max-height:160px">${imgs.map(i => `<div class="rounded-lg overflow-hidden cursor-zoom-in" style="height:75px;border:1px solid rgba(255,255,255,0.1)"><img src="${i.url}" class="w-full h-full object-cover" onclick="window.openLightbox('${i.url}')"></div>`).join('')}</div>`;
                    }
                }
                const priCls = PRI_BORDER[m.priority] || 'priority-none';
                const priDot = m.priority ? `<span style="color:${PRI_DOT[m.priority]};font-size:8px">⬤</span>` : '';
                const overdue = m.dueDate && m.dueDate < today && !m.completed;
                const dueBadge = m.dueDate ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md" style="${overdue ? 'background:rgba(244,63,94,0.2);color:#fda4af' : 'background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.45)'}">${overdue ? '⚠️ ' : '📅 '}${m.dueDate}</span>` : '';

                const startBadge = m.startDate ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md" style="background:rgba(96,165,250,0.15);color:rgba(147,197,253,0.9)">🗓 ${m.startDate}</span>` : '';
                const cardBg = m.completed ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.07)';
                const pinnedBorder = m.pinned && !m.completed ? ';box-shadow:0 0 0 1.5px rgba(251,191,36,0.35) inset' : '';
                const pinnedBadge = m.pinned && !m.completed ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded-md flex items-center gap-0.5" style="background:rgba(251,191,36,0.18);color:#fbbf24"><i data-lucide="pin" class="w-2.5 h-2.5"></i>已釘選</span>` : '';
                // 非自訂順序時隱藏拖曳把手；自訂順序模式下全部（含釘選）都可拖曳
                const dragDisabled = currentSortMode !== 'default';
                const dragHandleStyle = dragDisabled
                    ? 'color:rgba(255,255,255,0.08);cursor:default;pointer-events:none'
                    : (m.pinned ? 'color:rgba(251,191,36,0.45);cursor:grab' : 'color:rgba(255,255,255,0.2);cursor:grab');
                // 卡片分類 badge 用分類自己的顏色
                const cc = getCatColor(c);
                const catBadgeStyle = `background:${cc.bg};color:${cc.accent};border:1px solid ${cc.border}`;
                return `<li data-id="${m.id}" data-pinned="${m.pinned ? '1' : '0'}" class="flex flex-col ${compactView ? 'px-3 py-2.5' : 'p-4'} rounded-2xl card-hover ${priCls} relative group memo-card" style="background:${cardBg};border:1px solid rgba(255,255,255,0.08);${m.completed ? 'opacity:0.55' : ''}${pinnedBorder}">
                    <div class="flex items-start justify-between ${compactView ? 'mb-1' : 'mb-2'}">
                        <div class="flex items-center gap-1.5">
                            <div class="drag-handle p-1 -ml-1" style="${dragHandleStyle}"><i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i></div>
                            <button class="p-0.5 rounded-full transition-all" style="color:${m.completed ? '#60a5fa' : 'rgba(255,255,255,0.25)'}" onclick="window.toggleComplete('${m.id}')"><i data-lucide="${m.completed ? 'check-circle-2' : 'circle'}" class="${compactView ? 'w-4 h-4' : 'w-5 h-5'}"></i></button>
                            ${priDot}
                        </div>
                        <div class="flex gap-0.5">
                            <button onclick="window.togglePin('${m.id}')" class="p-1.5 rounded-lg transition-all" title="${m.pinned ? '取消釘選' : '釘選到頂部'}" style="color:${m.pinned ? '#fbbf24' : 'rgba(255,255,255,0.2)'}${m.pinned ? ';background:rgba(251,191,36,0.15)' : ''}"><i data-lucide="pin" class="w-3.5 h-3.5"></i></button>
                            <button onclick="window.editMemo('${m.id}')" class="p-1.5 rounded-lg transition-all" style="color:rgba(255,255,255,0.25)"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                            <button onclick="window.deleteMemo('${m.id}')" class="p-1.5 rounded-lg transition-all" style="color:rgba(255,255,255,0.2)"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                    <div class="flex-grow memo-text" style="font-size:${compactView ? '12px' : '14px'};color:${m.completed ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.85)'};${m.completed ? 'text-decoration:line-through' : ''};line-height:${compactView ? '1.45' : '1.6'}">${linkify(m.text || '無內容')}${imgH}</div>
                    ${m.note && !compactView ? `<div class="mt-1.5 text-xs italic" style="color:rgba(255,255,255,0.38);white-space:pre-wrap;word-break:break-word">${linkify(m.note)}</div>` : ''}
                    <div class="${compactView ? 'mt-2 pt-1.5' : 'mt-3 pt-2.5'} flex items-center gap-1.5 flex-wrap" style="border-top:1px solid rgba(255,255,255,0.07)">
                        ${compactView ? '' : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold" style="${catBadgeStyle}"><i data-lucide="${c.icon}" class="w-3 h-3"></i>${c.label}</span>`}
                        ${compactView ? `<span class="inline-flex items-center gap-1 text-[10px] font-semibold" style="color:${cc.accent}"><i data-lucide="${c.icon}" class="w-2.5 h-2.5"></i>${c.label}</span>` : ''}
                        ${pinnedBadge}
                        ${compactView ? '' : startBadge}
                        ${compactView ? '' : dueBadge}
                        ${compactView && m.dueDate ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md" style="${overdue ? 'background:rgba(244,63,94,0.15);color:#fda4af' : 'color:rgba(255,255,255,0.3)'}">   ${overdue ? '⚠️' : '📅'} ${m.dueDate}</span>` : ''}
                        <span class="ml-auto flex items-center gap-1.5 text-[10px]" style="color:rgba(255,255,255,0.25)">
                            ${m.updatedAt ? `<span style="color:rgba(167,139,250,0.7)" title="最後編輯時間"><i data-lucide="pencil" class="w-2.5 h-2.5 inline-block"></i> ${formatTime(m.updatedAt)}</span>` : `${formatTime(m.createdAt)}`}
                        </span>
                    </div>
                </li>`;
            }).join('') + '</ul>';
            lucide.createIcons();
            const listEl = document.getElementById('sortable-list');
            // 自訂順序模式下才允許拖曳
            if (listEl && !isLoading && currentSortMode === 'default') {
                // 釘選區和未釘選區各自為独立 group，釘選卡片只能在釘選區內拖曳
                new Sortable(listEl, {
                    handle: '.drag-handle',
                    animation: 150,
                    // 不用 filter，改用 group + onMove 控制拖曳規則
                    onMove(evt) {
                        const dragged = evt.dragged;   // 正在拖的卡片
                        const related = evt.related;   // 目標位置的卡片
                        const draggedPinned = dragged.dataset.pinned === '1';
                        const relatedPinned = related.dataset.pinned === '1';
                        // 釘選 vs 未釘選 跨區不可拖：全部進入同區功能
                        if (draggedPinned !== relatedPinned) return false;
                        return true;
                    },
                    onEnd: async () => {
                        const els = Array.from(listEl.children);
                        const now = Date.now();
                        // 釘選區和未釘選區各自獨立計算 order
                        let pinnedIdx = 0;
                        let unpinnedIdx = 0;
                        for (let i = 0; i < els.length; i++) {
                            const id = els[i].dataset.id;
                            const isPinned = els[i].dataset.pinned === '1';
                            // 釘選區：order 用負的大數（釘選區錯開區間）
                            // 未釘選區：order 用正的小數
                            if (isPinned) {
                                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId, id), { order: -(now * 2) + pinnedIdx });
                                pinnedIdx++;
                            } else {
                                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId, id), { order: -(now) + unpinnedIdx });
                                unpinnedIdx++;
                            }
                        }
                    }
                });
            }
        }

        // --- 全域掛載 ---
        window.selectCategory = (id) => {
            selectedCategory = id;
            renderApp();
            updateSubmitButtonState();
        };
        window.setFilter = (id) => { currentFilter = id; renderApp(); };
        window.toggleComplete = async (id) => { const m = memos.find(x => x.id === id); if (m) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId, id), { completed: !m.completed }); };
        window.togglePin = async (id) => {
            const m = memos.find(x => x.id === id);
            if (!m) return;
            const newPinned = !m.pinned;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId, id), { pinned: newPinned });
            showToast(newPinned ? '📌 已釘選至頂部' : '📌 已取消釘選', 'info');
        };
        window.editMemo = (id) => {
            const m = memos.find(x => x.id === id);
            if (m) {
                editingMemoId = id; memoInput.value = m.text || ''; selectedCategory = m.category;
                existingImages = m.images ? [...m.images] : (m.imageUrl ? [{ url: m.imageUrl, path: m.imagePath }] : []);
                pendingImageFiles = []; renderImagePreviews(); cancelEditBtn.classList.remove('hidden');
                priorityLevel = m.priority || 'high'; window.setPriority(priorityLevel);
                const dd = document.getElementById('memo-due-date'); if (dd) dd.value = m.dueDate || '';
                const sd = document.getElementById('memo-start-date'); if (sd) sd.value = m.startDate || '';
                const nd = document.getElementById('memo-note'); if (nd) nd.value = m.note || '';
                // 顯示編輯中 badge + 展開輸入區
                refreshEditingBadge();
                if (formCollapsed && formCollapsible) {
                    formCollapsed = false;
                    formCollapsible.style.maxHeight = '';
                    formCollapsible.style.opacity = '';
                    if (formToggleIcon) formToggleIcon.style.transform = '';
                }
                updateSubmitButtonState(); window.scrollTo({ top: 0, behavior: 'smooth' }); memoInput.focus();
            }
        };
        window.deleteMemo = (id) => { const m = memos.find(x => x.id === id); showConfirm('刪除備忘錄', '確定刪除嗎？', async () => { const imgs = m.images || (m.imagePath ? [{ path: m.imagePath }] : []); for (const i of imgs) { if (i.path) await deleteObject(ref(storage, i.path)).catch(e => console.error(e)); } await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId, id)); showToast('已刪除', 'info'); }); };
        window.openManageCategoriesModal = () => { renderManageList(); manageCategoriesModal.style.display = 'flex'; setTimeout(() => manageCategoriesModal.classList.remove('opacity-0'), 10); };
        window.closeManageCategoriesModal = () => { manageCategoriesModal.classList.add('opacity-0'); setTimeout(() => { manageCategoriesModal.style.display = 'none'; }, 300); };
        function renderManageList() { manageCategoriesList.innerHTML = categories.length ? `<ul class="space-y-2">` + categories.map(c => `<li class="flex items-center justify-between p-3 rounded-xl border border-slate-100"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full ${c.bgColor} ${c.color} flex items-center justify-center"><i data-lucide="${c.icon}" class="w-4 h-4"></i></div><span class="text-sm font-medium">${c.label}</span></div><div class="flex gap-1"><button onclick="window.editCategory('${c.id}')" class="p-2 text-slate-400"><i data-lucide="pencil" class="w-4 h-4"></i></button><button onclick="window.deleteCategory('${c.id}')" class="p-2 text-slate-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></li>`).join('') + `</ul>` : '<p class="py-8 text-center text-slate-400 text-sm">尚無分類</p>'; lucide.createIcons(); }
        window.openCategoryModal = (id = null) => { editingCategoryId = id; if (id) { const c = categories.find(x => x.id === id); catModalTitleText.textContent = '編輯分類'; catModalInput.value = c.label; newCatIcon = c.icon; newCatColorIndex = COLOR_OPTIONS.findIndex(o => o.color === c.color); } else { catModalTitleText.textContent = '自訂新分類'; catModalInput.value = ''; newCatIcon = ICON_OPTIONS[0]; newCatColorIndex = 0; } categoryModal.style.display = 'flex'; setTimeout(() => categoryModal.classList.remove('opacity-0'), 10); renderModalSelectors(); };
        window.closeCategoryModal = () => { categoryModal.classList.add('opacity-0'); setTimeout(() => { categoryModal.style.display = 'none'; }, 300); };
        window.editCategory = (id) => window.openCategoryModal(id);

        // 🌟 調整：刪除成功後關閉管理視窗
        window.deleteCategory = (id) => showConfirm('刪除分類？', '資料庫內容不會消失。', async () => {
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId + '_categories', id));
                showToast('已刪除分類', 'info');
                window.closeManageCategoriesModal(); // 刪除後關閉管理視窗
            } catch (e) {
                showToast('刪除失敗', 'error');
            }
        });

        window.setModalColor = (idx) => { newCatColorIndex = idx; renderModalSelectors(); };
        window.setModalIcon = (icon) => { newCatIcon = icon; renderModalSelectors(); };
        function renderModalSelectors() { catColorSelector.innerHTML = COLOR_OPTIONS.map((c, i) => `<button type="button" onclick="window.setModalColor(${i})" class="w-8 h-8 rounded-full ${c.display} flex items-center justify-center transition-all ${newCatColorIndex === i ? 'ring-2 ring-offset-2 ring-slate-400' : ''}">${newCatColorIndex === i ? '<i data-lucide="check" class="text-white w-4 h-4"></i>' : ''}</button>`).join(''); catIconSelector.innerHTML = ICON_OPTIONS.map(i => `<button type="button" onclick="window.setModalIcon('${i}')" class="p-2 rounded-xl transition-all ${newCatIcon === i ? 'bg-blue-50 text-blue-600 ring-1 ring-blue-200' : 'text-slate-400'}"><i data-lucide="${i}" class="w-5 h-5"></i></button>`).join(''); lucide.createIcons(); catModalSubmit.disabled = !catModalInput.value.trim(); }
        catModalInput.addEventListener('input', () => catModalSubmit.disabled = !catModalInput.value.trim());

        catModalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const color = COLOR_OPTIONS[newCatColorIndex];
            const data = { label: catModalInput.value.trim(), icon: newCatIcon, color: color.color, bgColor: color.bgColor, borderColor: color.borderColor };
            catModalSubmit.disabled = true;
            try {
                if (editingCategoryId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId + '_categories', editingCategoryId), data);
                    showToast('已更新分類');
                } else {
                    await setDoc(doc(collection(db, 'artifacts', appId, 'public', 'data', currentRoomId + '_categories')), { ...data, createdAt: Date.now() });
                    showToast('已新增分類');
                }
                window.closeCategoryModal();
                window.closeManageCategoriesModal();
            } catch (e) { console.error(e); showToast('儲存失敗', 'error'); }
            catModalSubmit.disabled = false;
        });

        if (clearCompletedBtn) clearCompletedBtn.addEventListener('click', () => { const done = memos.filter(m => m.completed); if (!done.length) return; showConfirm('清除已完成項目', `確定清除這 ${done.length} 筆嗎？`, async () => { for (const m of done) { const imgs = m.images || (m.imagePath ? [{ path: m.imagePath }] : []); for (const i of imgs) { if (i.path) await deleteObject(ref(storage, i.path)).catch(e => console.error(e)); } await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', currentRoomId, m.id)); } showToast('已清理', 'info'); }); });
    </script>
</body>

</html>
